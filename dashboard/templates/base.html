<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Bothr</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="application-name" content="Bothr Dashboard">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0d6efd">

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bothr">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  </head>
  <body>
    <!-- Top navbar (hidden on mobile, replaced by bottom nav) -->
    <nav class="navbar navbar-expand-lg navbar-dark app-navbar shadow-sm d-none d-lg-flex">
      <div class="container-fluid">
        <a class="navbar-brand fw-semibold" href="{{ url_for('dashboard') }}">Bothr</a>
        <div class="navbar-nav flex-row">
          <a class="nav-link {% if request.path == '/dashboard' %}active{% endif %}" href="{{ url_for('dashboard') }}">Dashboard</a>
          <a class="nav-link {% if request.path == '/settings' %}active{% endif %}" href="{{ url_for('settings.settings_page') }}">Settings</a>
          <a class="nav-link {% if request.path == '/calendar' %}active{% endif %}" href="{{ url_for('calendar_bp.calendar_page') }}">Calendar</a>
          <a class="nav-link {% if request.path == '/logs' %}active{% endif %}" href="{{ url_for('calendar_bp.logs_page') }}">Logs</a>
        </div>
        <button class="btn btn-sm btn-light d-none ms-3 install-app-btn" type="button" id="installAppBtnDesktop">Instalar app</button>
      </div>
    </nav>

    <!-- Mobile top bar -->
    <header class="mobile-header d-flex d-lg-none align-items-center px-3">
      <span class="mobile-header-title">Bothr</span>
      <button class="btn btn-sm btn-light ms-auto d-none install-app-btn" type="button" id="installAppBtnMobile">Instalar</button>
    </header>
    <div class="offline-banner d-none" id="offlineBanner">Sin conexión: algunos datos requieren internet.</div>

    <main class="container-fluid app-main py-3 px-3">
      {% block content %}{% endblock %}
    </main>

    <!-- Bottom navigation (mobile only) -->
    <nav class="bottom-nav d-flex d-lg-none">
      <a class="bottom-nav-item {% if request.path == '/dashboard' %}active{% endif %}" href="{{ url_for('dashboard') }}">
        <span class="bottom-nav-icon">🕐</span>
        <span>Estado</span>
      </a>
      <a class="bottom-nav-item {% if request.path == '/logs' %}active{% endif %}" href="{{ url_for('calendar_bp.logs_page') }}">
        <span class="bottom-nav-icon">📋</span>
        <span>Logs</span>
      </a>
      <a class="bottom-nav-item {% if request.path == '/calendar' %}active{% endif %}" href="{{ url_for('calendar_bp.calendar_page') }}">
        <span class="bottom-nav-icon">🗓️</span>
        <span>Calendario</span>
      </a>
      <a class="bottom-nav-item {% if request.path == '/settings' %}active{% endif %}" href="{{ url_for('settings.settings_page') }}">
        <span class="bottom-nav-icon">⚙️</span>
        <span>Config</span>
      </a>
    </nav>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div id="appToast" class="toast align-items-center text-bg-primary border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body" id="appToastBody"></div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const installState = {
        deferredPrompt: null,
        isIosInstallPath: typeof window.navigator.standalone === 'boolean' && !('onbeforeinstallprompt' in window)
      };
      const installButtons = [document.getElementById('installAppBtnDesktop'), document.getElementById('installAppBtnMobile')];

      window.showToast = function(message, isError = false) {
        const toastEl = document.getElementById('appToast');
        const bodyEl = document.getElementById('appToastBody');
        toastEl.classList.toggle('text-bg-danger', isError);
        toastEl.classList.toggle('text-bg-primary', !isError);
        bodyEl.textContent = message;
        bootstrap.Toast.getOrCreateInstance(toastEl).show();
      };
      window.isStandaloneMode = function() {
        return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      };
      window.syncStandaloneMode = function() {
        document.body.classList.toggle('standalone-mode', window.isStandaloneMode());
      };
      window.syncConnectionBanner = function() {
        const offlineBanner = document.getElementById('offlineBanner');
        if (!offlineBanner) return;
        offlineBanner.classList.toggle('d-none', navigator.onLine);
      };
      window.syncInstallButtons = function() {
        const canInstallPrompt = Boolean(installState.deferredPrompt);
        const showIosHint = installState.isIosInstallPath && !window.isStandaloneMode();
        const shouldShow = !window.isStandaloneMode() && (canInstallPrompt || showIosHint);
        installButtons.forEach((button) => button?.classList.toggle('d-none', !shouldShow));
      };
      window.handleInstallAction = async function() {
        if (installState.deferredPrompt) {
          installState.deferredPrompt.prompt();
          let installResult = null;
          try {
            installResult = await installState.deferredPrompt.userChoice;
          } catch (error) {
            console.error('Install prompt failed', error);
            window.showToast('No se pudo completar el diálogo de instalación.', true);
          }
          installState.deferredPrompt = null;
          if (installResult?.outcome === 'accepted') {
            window.showToast('Instalación iniciada correctamente.');
          } else if (installResult?.outcome === 'dismissed') {
            window.showToast('Instalación cancelada por el usuario.');
          }
          window.syncInstallButtons();
          return;
        }
        if (installState.isIosInstallPath && !window.isStandaloneMode()) {
          window.showToast('En Safari: Compartir → "Añadir a pantalla de inicio".');
        }
      };
      window.renderLastError = function(lastError, boxId, textId, buttonId = null) {
        const errorBox = document.getElementById(boxId);
        const errorText = document.getElementById(textId);
        const actionButton = buttonId ? document.getElementById(buttonId) : null;
        if (!errorBox || !errorText) return;
        if (lastError) {
          errorText.textContent = lastError;
          errorBox.classList.remove('d-none');
          actionButton?.classList.remove('d-none');
        } else {
          errorText.textContent = '';
          errorBox.classList.add('d-none');
          actionButton?.classList.add('d-none');
        }
      };
      window.markLastErrorAsSeen = async function(refreshCallback) {
        const response = await fetch('/api/errors/mark-seen', { method: 'POST' });
        const rawBody = await response.text();
        let data = {};
        if (rawBody) {
          try {
            data = JSON.parse(rawBody);
          } catch (error) {
            if (response.ok) {
              throw new Error('Respuesta inválida al marcar los errores como vistos.');
            }
            throw new Error('Error del servidor al marcar los errores como vistos.');
          }
        }
        if (!response.ok || !data.success) {
          throw new Error(data.error || 'No se pudieron marcar los errores como vistos.');
        }
        if (typeof refreshCallback === 'function') {
          await refreshCallback();
        }
        window.showToast('Errores marcados como vistos.');
      };
      window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        installState.deferredPrompt = event;
        window.syncInstallButtons();
      });
      window.addEventListener('appinstalled', () => {
        installState.deferredPrompt = null;
        window.syncStandaloneMode();
        window.syncInstallButtons();
      });
      window.addEventListener('online', window.syncConnectionBanner);
      window.addEventListener('offline', window.syncConnectionBanner);
      document.getElementById('installAppBtnDesktop')?.addEventListener('click', window.handleInstallAction);
      document.getElementById('installAppBtnMobile')?.addEventListener('click', window.handleInstallAction);
      window.syncStandaloneMode();
      window.syncConnectionBanner();
      window.syncInstallButtons();
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {});
      }
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bothr Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark app-navbar shadow-sm">
      <div class="container-fluid">
        <a class="navbar-brand fw-semibold" href="{{ url_for('dashboard') }}">Bothr</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link {% if request.path == '/dashboard' %}active{% endif %}" href="{{ url_for('dashboard') }}">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link {% if request.path == '/settings' %}active{% endif %}" href="{{ url_for('settings.settings_page') }}">Settings</a></li>
            <li class="nav-item"><a class="nav-link {% if request.path == '/calendar' %}active{% endif %}" href="{{ url_for('calendar_bp.calendar_page') }}">Calendar</a></li>
            <li class="nav-item"><a class="nav-link {% if request.path == '/logs' %}active{% endif %}" href="{{ url_for('calendar_bp.logs_page') }}">Logs</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      {% block content %}{% endblock %}
    </main>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div id="appToast" class="toast align-items-center text-bg-primary border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body" id="appToastBody"></div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      window.showToast = function(message, isError = false) {
        const toastEl = document.getElementById('appToast');
        const bodyEl = document.getElementById('appToastBody');
        toastEl.classList.toggle('text-bg-danger', isError);
        toastEl.classList.toggle('text-bg-primary', !isError);
        bodyEl.textContent = message;
        bootstrap.Toast.getOrCreateInstance(toastEl).show();
      };
      window.renderLastError = function(lastError, boxId, textId) {
        const errorBox = document.getElementById(boxId);
        const errorText = document.getElementById(textId);
        if (!errorBox || !errorText) return;
        if (lastError) {
          errorText.textContent = lastError;
          errorBox.classList.remove('d-none');
        } else {
          errorText.textContent = '';
          errorBox.classList.add('d-none');
        }
      };
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>

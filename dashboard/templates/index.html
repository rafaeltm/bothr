{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-xl-7 col-lg-9">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div>
            <h1 class="h3 mb-1">Estado del fichaje</h1>
            <p class="text-muted mb-0">Resumen automático actualizado cada 30 segundos.</p>
          </div>
          <span class="badge text-bg-dark" id="statusBadge">Cargando...</span>
        </div>
        <div class="row g-3">
          <div class="col-md-4">
            <div class="status-box">
              <div class="text-muted small">Próxima acción</div>
              <div class="fs-4 fw-semibold" id="nextAction">-</div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="status-box">
              <div class="text-muted small">Tiempo restante</div>
              <div class="fs-4 fw-semibold" id="timeRemaining">-</div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="status-box">
              <div class="text-muted small">Estado de hoy</div>
              <div class="small mt-2">
                <div>Entrada: <span id="todayIn" class="fw-semibold">-</span></div>
                <div>Salida: <span id="todayOut" class="fw-semibold">-</span></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  function formatNextAction(data) {
    const action = data.next_action || '-';
    const actionAt = data.next_action_at || '';
    return actionAt ? `${action} (${actionAt})` : action;
  }

  function formatTodayStatus(timestamp, fallbackDone) {
    if (timestamp) return timestamp;
    return fallbackDone ? 'Completada' : 'Pendiente';
  }

  async function refreshStatus() {
    try {
      const response = await fetch('/api/status');
      if (!response.ok) {
        throw new Error('Status no disponible');
      }
      const data = await response.json();
      document.getElementById('nextAction').textContent = formatNextAction(data);
      document.getElementById('timeRemaining').textContent = data.time_remaining || '-';
      document.getElementById('todayIn').textContent = formatTodayStatus(data.today_clocked_in_at, data.today_clocked_in);
      document.getElementById('todayOut').textContent = formatTodayStatus(data.today_clocked_out_at, data.today_clocked_out);
      document.getElementById('statusBadge').textContent = formatNextAction(data);
    } catch (error) {
      window.showToast('No se pudo actualizar el estado.', true);
    }
  }

  refreshStatus();
  setInterval(refreshStatus, 30000);
</script>
{% endblock %}
